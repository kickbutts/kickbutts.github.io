<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300, "stroke": null}, "axis": {"domainColor": "#bbb", "gridColor": "#e6e9ef", "labelColor": "#444", "tickColor": "#bbb", "titleColor": "#444"}, "background": "white", "legend": {"labelColor": "#444", "titleColor": "#444"}, "title": {"anchor": "start", "color": "#222", "fontSize": 15}}, "data": {"name": "data-0c3dd21eb6070b728e0973091f586cf8"}, "mark": {"type": "bar", "color": "#2c7be5"}, "encoding": {"tooltip": [{"field": "zustand", "type": "nominal"}, {"field": "minuten", "format": ".0f", "type": "quantitative"}], "x": {"axis": {"labelAngle": 0}, "field": "zustand", "sort": ["R\u00fcckstand 2+", "R\u00fcckstand 1", "Gleichstand", "F\u00fchrung 1"], "title": null, "type": "nominal"}, "y": {"field": "minuten", "title": "Minuten", "type": "quantitative"}}, "height": 320, "title": "Gespielte Minuten je Spielstand (Stichprobe)", "width": 520, "$schema": "https://vega.github.io/schema/vega-lite/v6.4.1.json", "datasets": {"data-0c3dd21eb6070b728e0973091f586cf8": [{"zustand": "R\u00fcckstand 2+", "minuten": 88.0}, {"zustand": "R\u00fcckstand 1", "minuten": 153.0}, {"zustand": "Gleichstand", "minuten": 460.0}, {"zustand": "F\u00fchrung 1", "minuten": 161.0}]}};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
